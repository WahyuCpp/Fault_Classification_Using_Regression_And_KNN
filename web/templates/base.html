<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MONTREAL-VT Motor Condition Monitoring{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Custom Engineering Dark Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <span style="color: #091cd7;">MONTREAL-VT</span>
                <span style="font-size: 0.8rem; font-weight: 400; color: #00d680; margin-left: 6px;"></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'dashboard' %}active text-info{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'database' %}active text-info{% endif %}" href="/database">Database</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'datasets' %}active text-info{% endif %}" href="/datasets">Datasets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'models' %}active text-info{% endif %}" href="/models">ML Models</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge-custom badge-info" id="navMachineBadge">MOTOR_001</span>
                    <span class="badge-custom badge-healthy" id="navStateBadge">RUNNING</span>
                    <span class="badge-custom" style="background:#334155; color:#cbd5e1;" id="navFsBadge">fs: 1500 Hz</span>
                    <span class="badge-custom" style="background:#1e293b; border: 1px solid #475569; color:#94a3b8;" id="navDbBadge">DB: Connecting...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container-fluid py-3 px-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
